
services:

  # ==========================================
  # APACHE KAFKA - DATA INGESTION
  # ==========================================

  kafka:
    image: apache/kafka:4.4.0
    container_name: disinfo-kafka
    hostname: kafka
    ports:
      - "127.0.0.1:9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - kafka-data:/var/lib/kafka/data

  # ==========================================
  # ELASTICSEARCH - DATA INDEXING & SEARCH
  # ==========================================

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.6
    container_name: disinfo-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.autoconfiguration.enabled=false
      - node.store.allow_mmap=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    mem_limit: 2g

  # ==========================================
  # KIBANA - DATA VISUALIZATION
  # ==========================================

  kibana:
    image: docker.elastic.co/kibana/kibana:9.5.6
    container_name: disinfo-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "127.0.0.1:5601:5601"
    depends_on:
      - elasticsearch
    mem_limit: 1g

  # ==========================================
  # HDFS NAMENODE - DISTRIBUTED FILE SYSTEM
  # ==========================================

  namenode:
    image: apache/hadoop:3.4.2
    container_name: disinfo-namenode
    hostname: namenode
    command: ["hdfs", "namenode"]
    environment:
      ENSURE_NAMENODE_DIR: /data/dfs/name
    ports:
      - "127.0.0.1:9870:9870"
    volumes:
      - namenode-data:/data
      - ./hadoop-conf/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./hadoop-conf/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro

  # ==========================================
  # HDFS DATANODE - DISTRIBUTED DATA STORAGE
  # ==========================================

  datanode:
    image: apache/hadoop:3.4.2
    container_name: disinfo-datanode
    hostname: datanode
    command: ["hdfs", "datanode"]
    depends_on:
      - namenode
    ports:
      - "127.0.0.1:9864:9864"
    volumes:
      - datanode-data:/data
      - ./hadoop-conf/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./hadoop-conf/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro


  # ==========================================
  # APACHE SPARK MASTER
  # ==========================================

  spark-master:
    image: apache/spark:4.1.3-scala2.13-java17-python3-r-ubuntu
    container_name: disinfo-spark-master
    hostname: spark-master
    entrypoint: ["/opt/spark/bin/spark-class"]
    command:
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
      - --port
      - "7077"
      - --webui-port
      - "8080"
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      HADOOP_CONF_DIR: /opt/spark/conf
    volumes:
      - ./hadoop-conf/core-site.xml:/opt/spark/conf/core-site.xml:ro
      - ./hadoop-conf/hdfs-site.xml:/opt/spark/conf/hdfs-site.xml:ro

  # ==========================================
  # APACHE SPARK WORKER
  # ==========================================

  spark-worker:
    image: apache/spark:4.1.3-scala2.13-java17-python3-r-ubuntu
    container_name: disinfo-spark-worker
    hostname: spark-worker
    entrypoint: ["/opt/spark/bin/spark-class"]
    command:
      - org.apache.spark.deploy.worker.Worker
      - --cores
      - "2"
      - --memory
      - 2g
      - --webui-port
      - "8081"
      - spark://spark-master:7077
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      HADOOP_CONF_DIR: /opt/spark/conf
    volumes:
      - ./hadoop-conf/core-site.xml:/opt/spark/conf/core-site.xml:ro
      - ./hadoop-conf/hdfs-site.xml:/opt/spark/conf/hdfs-site.xml:ro
    depends_on:
      - spark-master



# ==========================================
# PERSISTENT STORAGE
# ==========================================

volumes:
  kafka-data:
  elasticsearch-data:
  namenode-data:
  datanode-data:

